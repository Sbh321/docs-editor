name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      # Bundle size is deterministic, so it is safe to fail a build on.
      # The timing benchmarks (`pnpm bench`) are deliberately *not* gated —
      # they reach 25% relative margin of error on a shared CI runner, and
      # gating on a noisy signal only teaches people to ignore it. Run them
      # locally when judging a change; see docs/PERFORMANCE.md.
      - name: Bundle size budgets
        run: pnpm size:check

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm turbo run build

      - name: Install Playwright browsers
        run: pnpm --filter playground-react exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm turbo run test:e2e
